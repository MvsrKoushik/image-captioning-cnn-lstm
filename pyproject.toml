[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "image-captioning-cnn-lstm"
version = "1.0.0"
description = "CNN encoder and LSTM decoder image captioning components"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17", "pillow>=10"]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["src"]

